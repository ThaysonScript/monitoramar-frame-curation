[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoramar-frame-curation"
version = "0.1.0"
description = "Curadoria visual de frames para datasets de monitoramento costeiro contínuo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.9","numpy>=1.26","pandas>=2.2","scikit-learn>=1.4","PyYAML>=6.0","tqdm>=4.66"]

[project.optional-dependencies]
dinov2 = ["torch>=2.2","torchvision>=0.17"]
full = ["torch>=2.2","torchvision>=0.17"]
dev = ["pytest>=8.0","ruff>=0.5"]

[project.scripts]
monitoramar-curate = "monitoramar_curator.cli:main"
monitoramar-metrics = "monitoramar_curator.cli_metrics:main"
monitoramar-compare = "monitoramar_curator.cli_compare:main"
monitoramar-review = "monitoramar_curator.cli_review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
