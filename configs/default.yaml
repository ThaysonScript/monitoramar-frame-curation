sampling:
  target_fps: 2.0
redundancy:
  enabled: true
  method: phash
  threshold: 4
embedding:
  enabled: true
  backend: dinov2
  model: dinov2_vits14
  batch_size: 16
  device: auto
clustering:
  enabled: true
  algorithm: kmeans
  n_clusters: 50
  random_state: 42
selection:
  representatives_per_cluster: 1
  max_frames_per_video: 1000
output:
  jpeg_quality: 92
metrics:
  annotation_minutes_per_frame: 2.0
